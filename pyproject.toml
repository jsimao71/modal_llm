[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-llm"
version = "0.1.0"
description = "Controlled experiments for explicit Transformer modes and persistent goal state"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
modal-llm = "modal_llm.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
