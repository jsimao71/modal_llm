experiment: paper1-smoke-xpu
baseline: B10
seed: 0
device: xpu
model:
  d_model: 32
  nhead: 4
  layers: 1
  ff_mult: 2
  dropout: 0.0
  max_length: 96
data:
  train_size: 64
  validation_size: 32
  test_size: 32
  min_facets: 2
  max_facets: 4
  max_distractors: 2
  max_filler: 2
training:
  goal_warmup_epochs: 1
  validation_every: 1
  epochs: 1
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  loss_weights:
    lm: 1.0
    goal: 0.2
    goal_invariance: 0.2
    validation: 0.5
    ranking: 0.2
    facet: 0.2
evaluation:
  batch_size: 32
