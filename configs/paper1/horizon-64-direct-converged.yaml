experiment: paper1-horizon-64-direct-converged
baseline: B0
seed: 0
device: auto
model:
  d_model: 64
  nhead: 4
  layers: 2
  ff_mult: 4
  dropout: 0.1
  max_length: 1152
  generation_prompt_only: false
data:
  train_size: 2000
  validation_size: 256
  test_size: 128
  min_facets: 6
  max_facets: 6
  max_distractors: 0
  max_filler: 0
  goal_prompt_style: canonical
  target_repetitions: 10
  prompt_families: {train: standard, validation: reordered, test: interleaved}
  corruption_families: {train: single_flip, validation: late_flip, test: mixed}
training:
  goal_warmup_epochs: 0
  validation_every: 1
  early_stopping_patience: 10
  epochs: 160
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  loss_weights:
    lm: 1.0
evaluation:
  batch_size: 8
  goal_probe:
    enabled: false
