experiment: paper1-baselines
baselines: [B0, B1, B2, B3, B4, B5, B6, B7, B8, B9, B10]
seeds: [0, 1, 2, 3, 4]
device: auto
model:
  d_model: 128
  nhead: 8
  layers: 4
  ff_mult: 4
  dropout: 0.1
  max_length: 128
data:
  train_size: 20000
  validation_size: 2000
  test_size: 4000
  min_facets: 2
  max_facets: 6
  max_distractors: 4
  max_filler: 6
training:
  epochs: 12
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  loss_weights:
    lm: 1.0
    goal: 0.2
    validation: 0.5
    ranking: 0.2
    facet: 0.2
evaluation:
  batch_size: 256
